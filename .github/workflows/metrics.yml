name: Generate Metrics

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Metrics base
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jl115
          filename: output/metrics.base.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Europe/Zurich
          background: "#1e1e2e"
          title_color: "#cba6f7"
          text_color: "#cdd6f4"
          icon_color: "#89b4fa"
          border_color: "#45475a"
      - name: Metrics languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jl115
          filename: output/metrics.languages.svg
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/Zurich
          config_order: languages, metadata
          background: "#1e1e2e"
          title_color: "#cba6f7"
          text_color: "#cdd6f4"
          icon_color: "#89b4fa"
          border_color: "#45475a"
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
      - name: Metrics achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jl115
          filename: output/metrics.achievements.svg
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/Zurich
          background: "#1e1e2e"
          title_color: "#cba6f7"
          text_color: "#cdd6f4"
          icon_color: "#89b4fa"
          border_color: "#45475a"
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
      - name: Metrics activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jl115
          filename: output/metrics.activity.svg
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/Zurich
          background: "#1e1e2e"
          title_color: "#cba6f7"
          text_color: "#cdd6f4"
          icon_color: "#89b4fa"
          border_color: "#45475a"
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, commit
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
