<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Joël Leimbacher — Full Stack Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g fill="#cdd6f4">
    <circle cx="60" cy="50" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="110" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="90" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="70" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="95" r="1"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="80" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="100" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="45" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="180" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="200" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="170" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="190" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="175" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="205" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="165" r="1"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M0,240 C200,180 400,300 600,240 C800,180 1000,300 1200,240 L1200,340 L0,340 Z" fill="url(#aurora)" opacity="0.32">
    <animateTransform attributeName="transform" type="translate" values="0,0; -70,10; 0,0" dur="13s" repeatCount="indefinite"/>
  </path>
  <path d="M0,268 C220,208 420,320 620,258 C820,208 1020,320 1200,268 L1200,340 L0,340 Z" fill="url(#aurora)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; 60,-8; 0,0" dur="17s" repeatCount="indefinite"/>
  </path>

  <ellipse cx="600" cy="150" rx="430" ry="120" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <g id="terminal">
    <rect x="360" y="232" width="480" height="84" rx="12" fill="#313244" stroke="#45475a"/>
    <circle cx="384" cy="248" r="4" fill="#cba6f7"/>
    <circle cx="400" cy="248" r="4" fill="#fab387"/>
    <circle cx="416" cy="248" r="4" fill="#94e2d5"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.3;1" dur="6s" repeatCount="indefinite"/>
      <text x="384" y="272" font-family="'Fira Code',monospace" font-size="13" fill="#cba6f7">$</text>
      <text x="396" y="272" font-family="'Fira Code',monospace" font-size="13" fill="#cdd6f4">whoami</text>
      <rect x="452" y="261" width="8" height="13" fill="#94e2d5">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="384" y="292" font-family="'Fira Code',monospace" font-size="13" fill="#cdd6f4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.3;1" dur="6s" repeatCount="indefinite"/>
      &gt; Joël Leimbacher — Full Stack Engineer
    </text>
    <text x="384" y="309" font-family="'Fira Code',monospace" font-size="13" fill="#cdd6f4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.3;1" dur="6s" repeatCount="indefinite"/>
      &gt; status: building &amp; shipping systems
    </text>
  </g>

  <rect width="1200" height="20" y="0" fill="#cdd6f4" opacity="0.03">
    <animateTransform attributeName="transform" type="translate" values="0,-340; 0,340" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="162" text-anchor="middle" font-family="'Segoe UI',Fira Code,monospace" font-size="72" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#soft)">JOËL LEIMBACHER</text>
  <text x="600" y="208" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="23" fill="#a6adc8">From plumber to full-stack engineer — I build systems end to end.</text>
</svg>
