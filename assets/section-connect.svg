<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Section header: Connect">
  <defs>
    <linearGradient id="connectTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="connectBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="connectBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#89b4fa"/>
      <stop offset="75%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <filter id="connectGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#94e2d5" stroke-width="1.5" fill="none" opacity="0.9">
    <circle cx="64" cy="24" r="3" fill="#94e2d5"/>
    <circle cx="80" cy="24" r="3" fill="#74c7ec"/>
    <path d="M67,24 L73,24"/>
    <path d="M83,24 L90,24"/>
  </g>
  <text x="106" y="38" font-family="'Segoe UI','Fira Code',monospace" font-size="26" font-weight="800" letter-spacing="3" fill="url(#connectTitle)">CONNECT</text>
  <rect x="106" y="50" width="200" height="2" rx="1" fill="url(#connectBase)"/>
  <g filter="url(#connectGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="106,50; 306,50" dur="3.4s" repeatCount="indefinite"/>
      <circle r="4" fill="#94e2d5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
