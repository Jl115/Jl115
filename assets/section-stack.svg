<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Section header: Tech Stack">
  <defs>
    <linearGradient id="stackTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="stackBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stackBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset="40%" stop-color="#89b4fa"/>
      <stop offset="75%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <filter id="stackGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(60,18)">
    <path d="M8,0 L16,8 L8,16 L0,8 Z" fill="#cba6f7" opacity="0.9"/>
    <path d="M8,4 L12,8 L8,12 L4,8 Z" fill="#1e1e2e"/>
  </g>
  <text x="90" y="38" font-family="'Segoe UI','Fira Code',monospace" font-size="26" font-weight="800" letter-spacing="3" fill="url(#stackTitle)">TECH STACK</text>
  <rect x="60" y="50" width="320" height="2" rx="1" fill="url(#stackBase)"/>
  <g filter="url(#stackGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-320,0; 760,0" dur="7.5s" repeatCount="indefinite"/>
      <rect x="-130" y="48" width="260" height="6" rx="3" fill="url(#stackBeam)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
