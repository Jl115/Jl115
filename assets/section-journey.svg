<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Section header: The Journey">
  <defs>
    <linearGradient id="journeyTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="journeyBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="journeyBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94e2d5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#74c7ec"/>
      <stop offset="65%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="journeyGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="600" y="39" text-anchor="middle" font-family="'Segoe UI','Fira Code',monospace" font-size="26" font-weight="800" letter-spacing="4" fill="url(#journeyTitle)">THE JOURNEY</text>
  <g fill="#74c7ec" opacity="0.9">
    <text x="452" y="32" font-family="'Segoe UI','Fira Code',monospace" font-size="16" font-weight="700">[</text>
    <text x="742" y="32" font-family="'Segoe UI','Fira Code',monospace" font-size="16" font-weight="700">]</text>
  </g>
  <rect x="330" y="50" width="540" height="2" rx="1" fill="url(#journeyBase)"/>
  <g filter="url(#journeyGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="580,0; 20,0" dur="8s" repeatCount="indefinite"/>
      <rect x="-140" y="48" width="280" height="6" rx="3" fill="url(#journeyBeam)">
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
