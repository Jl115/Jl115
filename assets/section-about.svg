<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Section header: About">
  <defs>
    <linearGradient id="aboutTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="aboutBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aboutBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="35%" stop-color="#cba6f7"/>
      <stop offset="65%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0"/>
    </linearGradient>
    <filter id="aboutGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="40" y="32" font-family="'Segoe UI','Fira Code',monospace" font-size="22" font-weight="700" fill="#94e2d5">~</text>
  <text x="70" y="38" font-family="'Segoe UI','Fira Code',monospace" font-size="26" font-weight="800" letter-spacing="3" fill="url(#aboutTitle)">ABOUT</text>
  <rect x="40" y="50" width="280" height="2" rx="1" fill="url(#aboutBase)"/>
  <g filter="url(#aboutGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-300,0; 700,0" dur="7s" repeatCount="indefinite"/>
      <rect x="-120" y="48" width="240" height="6" rx="3" fill="url(#aboutBeam)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
