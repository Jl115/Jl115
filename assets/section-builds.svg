<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Section header: Featured Builds">
  <defs>
    <linearGradient id="buildsTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="buildsBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94e2d5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="buildsBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#89b4fa"/>
      <stop offset="75%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <filter id="buildsGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="1160" y="38" text-anchor="end" font-family="'Segoe UI','Fira Code',monospace" font-size="26" font-weight="800" letter-spacing="3" fill="url(#buildsTitle)">FEATURED BUILDS</text>
  <g transform="translate(838,18)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="none" stroke="#fab387" stroke-width="2"/>
    <rect x="4" y="-4" width="14" height="14" rx="2" fill="none" stroke="#74c7ec" stroke-width="2"/>
  </g>
  <rect x="840" y="50" width="320" height="2" rx="1" fill="url(#buildsBase)"/>
  <g filter="url(#buildsGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="760,0; -320,0" dur="7.5s" repeatCount="indefinite"/>
      <rect x="-130" y="48" width="260" height="6" rx="3" fill="url(#buildsBeam)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
