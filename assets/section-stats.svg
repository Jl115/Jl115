<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Section header: GitHub Stats">
  <defs>
    <linearGradient id="statsTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="statsBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="statsBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94e2d5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#88c0d0"/>
      <stop offset="70%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="statsGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(60,16)">
    <rect x="0" y="10" width="4" height="8" rx="1" fill="#94e2d5"/>
    <rect x="7" y="6" width="4" height="12" rx="1" fill="#74c7ec"/>
    <rect x="14" y="2" width="4" height="16" rx="1" fill="#89b4fa"/>
    <rect x="21" y="8" width="4" height="10" rx="1" fill="#cba6f7"/>
  </g>
  <text x="92" y="38" font-family="'Segoe UI','Fira Code',monospace" font-size="26" font-weight="800" letter-spacing="3" fill="url(#statsTitle)">GITHUB STATS</text>
  <rect x="60" y="50" width="296" height="2" rx="1" fill="url(#statsBase)"/>
  <g filter="url(#statsGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-300,0; 720,0" dur="6.5s" repeatCount="indefinite"/>
      <rect x="-120" y="48" width="240" height="6" rx="3" fill="url(#statsBeam)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
