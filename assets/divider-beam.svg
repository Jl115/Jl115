<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" role="img" aria-label="Aurora divider with a traveling light beam">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#cba6f7"/>
      <stop offset="60%" stop-color="#89b4fa"/>
      <stop offset="80%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#74c7ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
    <filter id="beamGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="29" width="1200" height="2" rx="1" fill="url(#baseGrad)"/>
  <g filter="url(#beamGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-400,0; 1600,0" dur="7s" repeatCount="indefinite"/>
      <rect x="-200" y="27" width="400" height="6" rx="3" fill="url(#beamGrad)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <ellipse cx="0" cy="30" rx="60" ry="12" fill="#89b4fa" opacity="0.5">
        <animate attributeName="opacity" values="0.25;0.6;0.25" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
